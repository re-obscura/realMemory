[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realmemory"
version = "0.8.1"
description = "Persistent memory layer for LLM agents: exact-scan hybrid retrieval, associative assembly network, novelty-gated writes, trace decay, sleep-time consolidation."
readme = "README.md"
requires-python = ">=3.11"  # typing.Self в hippocampus; 3.10 не поддерживается
license = { text = "MIT" }
authors = [{ name = "realMemory" }]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0", "mcp>=1.10"]
# командный слой: TUI публикаций (network-транспорт добавится позже)
team = ["textual>=2,<3", "rich>=13", "pyyaml>=6"]
# пин по минору: смена версии fastembed меняет пулинг/векторы той же модели
local = ["fastembed>=0.8,<0.9"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# conftest поднимает sys.path до импорта realmemory; в тестах допустимы
# импорты по месту и компактный `con.commit(); con.close()`
"tests/*" = ["E402", "E702"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# технический долг типизации: MemoryRecord.id Optional до вставки,
# нестабильные стабы fastembed — ужесточить отдельным проходом
[[tool.mypy.overrides]]
module = ["realmemory.hippocampus", "realmemory.encoding.embedder_local"]
disable_error_code = ["arg-type", "call-overload"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realmemory"
# версия single-source из realmemory.__version__ (setuptools парсит литерал,
# не импортируя пакет): раньше константа в __init__ отстала от релиза на два
# минора (0.8.2 против 0.9.0)
dynamic = ["version"]
description = "Persistent memory layer for LLM agents: exact-scan hybrid retrieval, associative assembly network, novelty-gated writes, trace decay, sleep-time consolidation."
readme = "README.md"
requires-python = ">=3.11"  # typing.Self в hippocampus; 3.10 не поддерживается
license = { text = "MIT" }
authors = [{ name = "realMemory" }]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0", "mcp>=1.10"]
# командный слой: TUI публикаций (network-транспорт добавится позже)
team = ["textual>=2,<3", "rich>=13", "pyyaml>=6"]
# пин по минору: смена версии fastembed меняет пулинг/векторы той же модели
local = ["fastembed>=0.8,<0.9"]
dev = ["pytest>=8.0", "ruff>=0.15,<0.16", "mypy>=1.10"]
# пин ruff по минору: новые миноры вводят правила в дефолт (например, ISC004),
# что молча красит CI на свежих ранерах — обновлять осознанно, вместе с кодом

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "realmemory.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# conftest поднимает sys.path до импорта realmemory; в тестах допустимы
# импорты по месту и компактный `con.commit(); con.close()`
"tests/*" = ["E402", "E702"]

[tool.mypy]
# 3.12, хотя requires-python = ">=3.11": стабы numpy используют type-statement
# 3.12 и не парсятся под 3.11. Целевая синтаксическая совместимость с 3.11
# обеспечивается ruff target-version = py311.
python_version = "3.12"
ignore_missing_imports = true
